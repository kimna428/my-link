<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Link</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f7fb;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 90%;
        max-width: 420px;
        padding: 32px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0 0 24px;
        color: #555;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      a {
        display: block;
        padding: 14px 16px;
        border-radius: 12px;
        background: #111827;
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        background: #374151;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>My Link</h1>
      <p>김나영의 마이링크 페이지입니다.</p>

      <div class="links">
        <a href="https://github.com/kimna428" target="_blank" rel="noreferrer">
          GitHub
        </a>
        <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">
          Instagram
        </a>
        <a href="https://www.youtube.com/" target="_blank" rel="noreferrer">
          YouTube
        </a>
      </div>
    </main>
  </body>
</html>
